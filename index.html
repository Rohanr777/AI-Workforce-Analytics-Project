<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Workforce Analytics</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
}

header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
}

nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  padding:15px;
  background:white;
}

nav button{
  padding:12px 20px;
  border:none;
  background:#222;
  color:white;
  cursor:pointer;
  border-radius:5px;
  transition:0.3s;
}

nav button:hover{
  background:#555;
}

.dashboard{
  display:none;
  width:100%;
  height:90vh;
}

.dashboard.active{
  display:block;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

</style>
</head>

<body>

<header>
  <h1>AI Workforce Analytics Dashboard</h1>
</header>

<nav>
  <button onclick="showDashboard('d1')">Overview</button>

  <button onclick="showDashboard('d2')">
    AI Workforce
  </button>

  <button onclick="showDashboard('d3')">
    Layoff Risk
  </button>

  <button onclick="showDashboard('d4')">
    AI Automation
  </button>

  <button onclick="showDashboard('d5')">
    Workplace Insights
  </button>

  <button onclick="showDashboard('d6')">
    Final Insights
  </button>
</nav>

<!-- Dashboard 1 -->
<div id="d1" class="dashboard active">
<iframe src="https://public.tableau.com/views/AIWorkforceAnalyticsProject/ProjectOverview?:showVizHome=no"></iframe>
</div>

<!-- Dashboard 2 -->
<div id="d2" class="dashboard">
<iframe src="https://public.tableau.com/views/AIWorkforceAnalyticsProject/AIWorkforceAnalyticsOverview?:showVizHome=no"></iframe>
</div>

<!-- Dashboard 3 -->
<div id="d3" class="dashboard">
<iframe src="https://public.tableau.com/views/AIWorkforceAnalyticsProject/WorkforceLayoffRiskAnalysisDashboard?:showVizHome=no"></iframe>
</div>

<!-- Dashboard 4 -->
<div id="d4" class="dashboard">
<iframe src="https://public.tableau.com/views/AIWorkforceAnalyticsProject/AIAutomationImpactAnalysis?:showVizHome=no"></iframe>
</div>

<!-- Dashboard 5 -->
<div id="d5" class="dashboard">
<iframe src="https://public.tableau.com/views/AIWorkforceAnalyticsProject/EmployeeWorkplaceInsights?:showVizHome=no"></iframe>
</div>

<!-- Dashboard 6 -->
<div id="d6" class="dashboard">
<iframe src="https://public.tableau.com/views/AIWorkforceAnalyticsProject/DashboardInsights?:showVizHome=no"></iframe>
</div>

<script>

function showDashboard(id){

  let dashboards=document.querySelectorAll('.dashboard');

  dashboards.forEach(d=>{
    d.classList.remove('active');
  });

  document.getElementById(id).classList.add('active');
}

</script>

</body>
</html>
