<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Workforce Analytics</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f4f4;
}

header{
  background:#111;
  color:white;
  text-align:center;
  padding:20px;
}

nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  padding:20px;
  background:white;
}

nav button{
  padding:12px 20px;
  border:none;
  background:#222;
  color:white;
  border-radius:5px;
  cursor:pointer;
  transition:0.3s;
}

nav button:hover{
  background:#555;
}

#tableauViz{
  width:100%;
  height:1400px;
}

.tableauPlaceholder{
  width:100%;
  height:100%;
}

.tableauViz{
  width:100%;
  height:100%;
}

</style>
</head>

<body>

<header>
  <h1>AI Workforce Analytics Dashboard</h1>
</header>

<nav>

<button onclick="loadViz('ProjectOverview')">
Overview
</button>

<button onclick="loadViz('AIWorkforceAnalyticsOverview')">
AI Workforce
</button>

<button onclick="loadViz('WorkforceLayoffRiskAnalysisDashboard')">
Layoff Risk
</button>

<button onclick="loadViz('AIAutomationImpactAnalysis')">
AI Automation
</button>

<button onclick="loadViz('EmployeeWorkplaceInsights')">
Workplace
</button>

<button onclick="loadViz('DashboardInsights')">
Final Insights
</button>

</nav>

<div id="tableauViz"></div>

<script src="https://public.tableau.com/javascripts/api/tableau-2.min.js"></script>

<script>

let viz;

function loadViz(sheetName){

  const containerDiv = document.getElementById("tableauViz");

  const url =
  `https://public.tableau.com/views/AIWorkforceAnalyticsProject/${sheetName}?:showVizHome=no`;

  if(viz){
    viz.dispose();
  }

  const options = {
    width: "100%",
    height: "1400px",
    hideTabs: true,
    hideToolbar: false
  };

  viz = new tableau.Viz(containerDiv, url, options);
}

loadViz('ProjectOverview');

</script>

</body>
</html>
